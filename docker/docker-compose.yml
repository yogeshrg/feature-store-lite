version: "3.8"

services:
  feature-store-lite:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: feature-store-lite
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  feature_store_lite_data:
